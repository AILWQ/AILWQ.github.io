name: Update Google Scholar stats

# 每天自动抓取 Google Scholar 引用统计，更新 scholar-stats.json 并部署到 GitHub Pages。
# 主页 index.html 会在浏览器端读取 scholar-stats.json，动态显示最新的引用数/ h指数 / i10。
# 注意：用 GITHUB_TOKEN 提交不会触发 deploy-pages 的 on:push，因此本工作流自带部署步骤。

on:
  schedule:
    - cron: '17 6 * * *'   # 每天 UTC 06:17（北京时间约 14:17）运行一次
  workflow_dispatch:        # 也可在 Actions 页面手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch & update Scholar stats
        env:
          SCHOLAR_USER: b-MGt8gAAAAJ
        run: |
          python3 scripts/update_scholar_stats.py "$SCHOLAR_USER" scholar-stats.json

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- scholar-stats.json; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit & deploy."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scholar-stats.json
            git commit -m "chore: auto-update Google Scholar citation stats"
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'yes'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'yes'
        id: deployment
        uses: actions/deploy-pages@v4
